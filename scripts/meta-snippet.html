<!--
  Copy this block into any new static HTML page under public/.
  Replace TITLE, DESCRIPTION, CANONICAL_PATH, and IMAGE_PATH.
  IMAGE_PATH defaults: /og-default.png (site-wide) or a page-specific 1200×630 PNG.
  For gated/admin pages, skip social tags and use:
    <meta name="robots" content="noindex, nofollow" />
-->
<title>TITLE</title>
<meta name="description" content="DESCRIPTION" />
<link rel="canonical" href="https://statecraft.systems/CANONICAL_PATH" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="Statecraft Systems" />
<meta property="og:title" content="TITLE" />
<meta property="og:description" content="DESCRIPTION" />
<meta property="og:url" content="https://statecraft.systems/CANONICAL_PATH" />
<meta property="og:image" content="https://statecraft.systems/IMAGE_PATH" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="TITLE" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="TITLE" />
<meta name="twitter:description" content="DESCRIPTION" />
<meta name="twitter:image" content="https://statecraft.systems/IMAGE_PATH" />
<meta name="twitter:image:alt" content="TITLE" />
